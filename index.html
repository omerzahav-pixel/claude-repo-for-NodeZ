<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NodeZ — Idea Vault</title>
<meta name="description" content="A mobile-first knowledge canvas for Markdown notes, formulas, and linked ideas.">
<meta name="theme-color" content="#0F0F0F">
<!-- Phase 2 · PWA manifest + Apple meta. iOS Safari still ignores most of
     the manifest, so the `apple-*` tags are load-bearing for "Add to Home
     Screen" to launch in standalone mode with the right status-bar style.
     apple-touch-icon points at the 180×180 PNG (Apple's canonical size). -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NodeZ">
<meta name="format-detection" content="telephone=no">
<!-- PWACompat fills in the non-standard Microsoft / Apple metas the
     manifest would otherwise provide so a single manifest.webmanifest covers
     every target. Loads defer, runs after the manifest is fetched. -->
<script async src="https://cdn.jsdelivr.net/npm/pwacompat@2.0.17/pwacompat.min.js" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<!-- When auto-render (the dependent KaTeX module) finishes, re-run the app's
     render() so formula nodes + inline math inside note bodies get typeset.
     Non-deferred app.js at end of body runs before these defer scripts,
     so the very first render() paints with window.katex still undefined. -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="window.dbg&&window.dbg('KATEX','auto-render onload fired · renderMathInElement='+(window.renderMathInElement?'yes':'MISSING')+' · window.render='+(window.render?'yes':'MISSING'));if(window.render){try{window.render()}catch(e){window.dbg&&window.dbg('KATEX','render() threw: '+e.message)}}"></script>
<link rel="stylesheet" href="./src/app.css">
<!-- Phase 1 · 1.6c — bootstrap.ts loads rbush as a module and exposes it
     on window.RBush so the non-module app.js can use it for viewport
     culling without breaking the D2 non-module pivot. -->
<script type="module" src="./src/bootstrap.ts"></script>
</head>
<body>
<div id="tb">
<select id="wsSel" onchange="switchWorkspace(this.value)" style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text);cursor:pointer"></select>
<button onclick="newWorkspace()" title="New workspace">＋ WS</button>
<button id="heBtn" onclick="toggleHebrew()" title="Hebrew mode">א/A</button>
<span class="sep"></span>
<button id="backBtn" onclick="goBack()" style="display:none;background:var(--accent);color:#0F0F0F;font-weight:600;border:none">← Back</button>
<button class="ac" id="addBtn" onclick="addC()">+ Add</button>
<button id="zoneBtn" onclick="addZoneCenter()">+ Zone</button>
<span class="sep"></span>
<input id="sr" placeholder="Search canvas…" oninput="aF()" style="min-width:110px"/>
<span class="sep"></span>
<button id="fitBtn" onclick="zF()">Fit</button>
<button id="undoBtn" onclick="un()" title="Ctrl+Z">↶</button>
<button id="dimEdgesBtn" onclick="toggleDimEdges()" title="Dim edges (focus on nodes)">⌇</button>
<span class="sep"></span>
<!-- Phase 1.8 · promoted to top toolbar.
     ⇲ = paste-patch modal (no file picker; pure JS action).
     ⇅ = import full state. MUST be a <label for="imp"> so iOS Safari
          preserves the user-gesture chain into the hidden file input
          (same pattern as the More-menu items). Styled below as a button. -->
<button id="patchBtn" onclick="showPatch()" title="Paste patch JSON">⇲</button>
<label id="importBtn" for="imp" class="tbLabel" title="Import full state JSON" onclick="window.dbg&&window.dbg('IMPORT','toolbar ⇅ tapped — label forwards to #imp')">⇅</label>
<span class="sep"></span>
<button id="moreBtn" onclick="toggleMore();window.dbg&&window.dbg('IMPORT','More tapped · now '+(document.getElementById('more').classList.contains('on')?'OPEN':'closed'));event.stopPropagation()">⋯ More</button>
<div id="more"><div id="moreBody"></div></div>
<div id="indicators"><span class="ind s-ok" id="saveInd" title="Save status"></span><span class="ind" id="expInd" title="Export flash"></span></div>
<!-- iOS Safari blocks synthetic .click() on a hidden file input called from
     a JS onclick handler because the user-gesture activation doesn't forward
     through the hop. The More-menu items below are <label for="imp">/…impC
     so the browser treats a tap on the menu item as a tap on the input,
     which keeps the gesture intact. For that, the inputs must be in the
     layout tree (not display:none), so they're visually hidden instead. -->
<input id="imp" type="file" accept=".json" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0" onclick="window.dbg&&window.dbg('IMPORT','#imp received click event (iOS user-gesture forwarded)')" onchange="window.dbg&&window.dbg('IMPORT','#imp change event fired · files='+(this.files&&this.files.length||0));imF(event)"/>
<input id="impC" type="file" accept=".json" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0" onclick="window.dbg&&window.dbg('IMPORT','#impC received click event')" onchange="window.dbg&&window.dbg('IMPORT','#impC change event fired · files='+(this.files&&this.files.length||0));imFCanvas(event)"/>
</div>
<div id="bc"></div>
<div id="fl"></div>
<button id="lgBtn" onclick="toggleLegend()" title="Legend">?</button>
<div id="lg"><span class="tog" onclick="hideLegend()">×</span>
<div class="body" id="lgBody"></div></div>
<div id="pn"></div><div id="ctx"></div><div id="ep"></div><div id="modal"><div class="mc" id="mcbody"></div></div>
<div id="sb"><div class="sbhead" onclick="sbHeadClick(event)"><span class="sbtog" onclick="event.stopPropagation();cycleSb()">☰</span><span id="sbName">Nodes</span><span style="flex:1"></span><span class="sbtog" onclick="event.stopPropagation();collapseAllZones()" title="Collapse / expand all">⇕</span><span class="sbtog" onclick="event.stopPropagation();document.getElementById('sb').classList.toggle('mini')" title="Minimize to bottom">▾</span></div><div class="sbsearch"><input id="sbq" placeholder="Filter list…" oninput="renderSB()"/></div><div class="sbbody" id="sbbody"></div><div class="resize" onpointerdown="sbResize(event)"></div></div>
<div id="tabs"></div>
<svg id="cv"></svg>
<!-- D3 / Phase 1.6 — HTML overlay layer for rich content that iOS WebKit
     refuses to paint inside SVG <foreignObject>. Shares the canvas's
     transform (translate/scale of view.x/view.y/view.k) so children can use
     plain left/top in world coords. pointer-events:none by default so taps
     fall through to the SVG below; individual overlay children can re-enable
     events when they need them (scrollable note bodies, link clicks…). -->
<div id="canvasOverlay"></div>
<div class="hint">Click: edit · Drag: move · Shift+drag: connect · Ctrl+click: multi-select · Ctrl+drag empty: marquee · Right-click: menu · Del: remove · Dbl-click: new</div>
<script src="./app.js"></script>
</body>
</html>
